[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tallyho"
version = "1.0.0"
description = "TallyHo — ti porta a spasso nella storia elettorale italiana. Scende la gerarchia dell'Archivio Storico delle Elezioni (elezionistorico.interno.gov.it, 1946-oggi) per ogni data disponibile e ti consegna la serie storica completa di un comune in CSV e JSON, senza un solo click a mano."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jacopo Peracchio" }]
keywords = ["elezioni", "italia", "ministero-interno", "dait", "scraper", "open-data", "storia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Sociology",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.28"]

[project.scripts]
tallyho = "tallyho.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: test che richiedono rete (esclusi di default, esegui con -m integration)",
]
