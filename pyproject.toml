[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tallyho"
version = "1.0.0"
description = "TallyHo — ti porta a spasso nella storia elettorale italiana. Scende la gerarchia dell'Archivio Storico delle Elezioni (elezionistorico.interno.gov.it, 1946-oggi) per ogni data disponibile e ti consegna la serie storica completa di un comune in CSV e JSON, senza un solo click a mano."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jacopo Peracchio" }]
keywords = ["elezioni", "italia", "ministero-interno", "dait", "scraper", "open-data", "storia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Sociology",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.28", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
tallyho = "tallyho.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]
xlsx = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14"]
yaml = ["pyyaml>=6"]
all = ["openpyxl>=3.1", "pyarrow>=14", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: test che richiedono rete (esclusi di default, esegui con -m integration)",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Regole base: errori di stile (E), variabili non definite/import inutilizzati
# (F), warning (W). E501 (riga lunga) non è attiva: il codice usa stringhe
# help lunghe e docstring che superano 88 colonne senza nuocere alla lettura.
select = ["E4", "E7", "E9", "F"]
